<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petite Bibliothèque</title>
<meta name="description" content="My little library — books I want to read, own, and have read.">
<meta name="theme-color" content="#f8f4ee">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f8f4ee'/%3E%3Crect x='14' y='14' width='9' height='36' fill='%23b06a74'/%3E%3Crect x='25' y='18' width='8' height='32' fill='%232b2523'/%3E%3Crect x='35' y='12' width='9' height='38' fill='%23ad9064'/%3E%3Crect x='46' y='16' width='5' height='34' transform='rotate(-8 48 50)' fill='%23cfd9e8'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="assets/backdrops/t4.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="wrap">
  <header class="top">
    <div>
      <span class="sc">a reading journal</span>
      <h1>Petite Bibliothèque</h1>
      <p class="lede"><b id="count">–</b> books on the shelf</p>
      <p class="mode" id="mode"></p>
    </div>
    <button class="menu-btn" id="menu-open" aria-label="メニューを開く"><span class="bars"><i></i><i></i><i></i></span>Menu</button>
  </header>

  <nav class="nav">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="shelf" aria-selected="true">Shelf</button>
      <button class="tab" role="tab" data-view="list">List</button>
      <button class="tab" role="tab" data-view="add">Add a book</button>
    </div>
    <div class="filters" id="filters">
      <div class="chips" id="status-chips"></div>
      <div class="chips" id="shelf-chips"></div>
    </div>
  </nav>

  <main id="main"><section class="shelfbox"><p class="empty">Opening the library…</p></section></main>
</div>
<footer class="foot">Book data from <a href="https://webservice.rakuten.co.jp/" target="_blank" rel="noopener">Supported by Rakuten Developers</a> and Google Books</footer>
<div id="sheet-root"></div>
<div id="drawer-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
